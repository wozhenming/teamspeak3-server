version: '3'

services:
  teamspeak:
    image: teamspeak:3.13
    container_name: ts-e2e
    restart: unless-stopped
    environment:
      - TS3SERVER_LICENSE=accept  # 接受许可证（免费，最多 32 槽位）
    ports:
      - "9987:9987/udp"      # 语音端口（必须）
      - "30033:30033/tcp"      # 文件传输端口
      - "10011:10011/tcp"     # ServerQuery（管理面板/点歌机器人经内网使用）
    volumes:
      - teamspeak-data:/teamspeak3-server/  # 数据持久化
      - ./query_ip_allowlist.txt:/teamspeak3-server/query_ip_allowlist.txt:ro

volumes:
  teamspeak-data:
